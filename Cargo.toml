[package]
name = "otter"
version = "0.1.0"
edition = "2024"
authors = ["Giuseppe Della Vedova"]
license = "MIT"
description = "Experimental multithreaded JS runtime"
repository = "https://github.com/gi-dellav/otter"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rquickjs = { version = "0.12.2", features = ["parallel", "bindgen"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
